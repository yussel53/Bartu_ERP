# Bartu ERP — her push ve PR'da derleme + tip kontrolü + SqlUpdates kuralları (CONTRIBUTING §4, §6)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet build (0 hata)
        run: dotnet build BackendAPI -c Release --nologo

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontendUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FrontendUI/package-lock.json
      - run: npm ci
      - name: Tip kontrolü (npx tsc -b → 0 hata)
        run: npx tsc -b --force
      - name: vite build
        run: npx vite build

  sql-updates:
    name: SqlUpdates kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dosya adı ve numara tekrarı
        run: |
          set -e
          # Eski scriptler NN_ (2–3 hane); yeni scriptler yyyyMMddHHmmss_ (14 hane, geçerli tarih-saat)
          bad=$(ls SqlUpdates | grep -vE '^([0-9]{2,3}|20[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9])_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Kurala uymayan script adı (yyyyMMddHHmmss_modul_konu.sql, küçük harf): $bad"; exit 1
          fi
          dup=$(ls SqlUpdates | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Aynı numara birden fazla scriptte: $dup — birleştirilmemiş taraf scriptini yeni bir zaman damgasına taşısın"; exit 1
          fi
      - name: main'e girmiş script değişmemeli
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            range="$base...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "İlk push — karşılaştırma yok"; exit 0
            fi
            range="$before ${{ github.sha }}"
          fi
          changed=$(git diff --name-status $range -- SqlUpdates | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then
            echo "::error::main'e girmiş SqlUpdates scripti değiştirilmiş / silinmiş / yeniden adlandırılmış (düzeltme için yeni zaman damgalı script açın):"
            echo "$changed"; exit 1
          fi
